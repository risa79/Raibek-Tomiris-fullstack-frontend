<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мой профиль — SkillSwap</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">↔</span> SkillSwap</a><nav id="nav" class="nav" aria-label="Основная навигация"><a href="index.html">Главная</a><a href="offers.html">Найти обмен</a><a href="profile.html" aria-current="page">Мой профиль</a></nav><button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="nav">☰ <span class="sr-only">Открыть меню</span></button></header><main class="page"><div class="page-title"><div><span class="eyebrow">Личный кабинет</span><h1>Мои навыки</h1><p>Предлагай свои знания и сохраняй интересные обмены.</p></div></div><div class="profile-layout"><section class="panel"><h2>Новое предложение</h2><form id="offerForm" novalidate><label for="author">Твоё имя</label><input id="author" name="author" required minlength="2" maxlength="40" placeholder="Например, Айдана"><label for="teach">Чему можешь научить</label><input id="teach" name="teach" required minlength="2" maxlength="60" placeholder="Английский"><label for="learn">Чему хочешь научиться</label><input id="learn" name="learn" required minlength="2" maxlength="60" placeholder="Python"><label for="offerCategory">Категория твоего навыка</label><select id="offerCategory" name="category"><option>Языки</option><option>Программирование</option><option>Дизайн</option><option>Учёба</option></select><label for="description">Краткое описание</label><textarea id="description" name="description" rows="3" required minlength="10" maxlength="220" placeholder="Какой у тебя опыт и как удобно заниматься?"></textarea><p class="error" id="formError" role="alert"></p><button class="btn primary full" type="submit">Опубликовать предложение</button></form></section><div class="profile-side"><section class="panel"><h2>Мои предложения <span id="myCount" class="badge">0</span></h2><div id="myOffers" class="stack"></div></section><section class="panel"><h2>Мои запросы <span id="requestCount" class="badge">0</span></h2><div id="myRequests" class="stack"></div></section></div></div></main><footer class="footer"><span>↔ SkillSwap · Учись. Делись. Расти.</span><span>Учебный MVP · 2026</span></footer><script src="js/app.js" defer></script></body></html>
